name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: SDL2 (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build tools and emulator
        run: cargo build --release -p rl-tool -p rl-emu
      - name: Unit tests (no game data needed)
        run: cargo test --release -p rl-emu -p rl-assets -p rl-tool
      - uses: actions/upload-artifact@v4
        with:
          name: rising-lands-${{ matrix.os }}
          path: |
            target/release/rl-emu
            target/release/rl-emu.exe
            target/release/rl-tool
            target/release/rl-tool.exe
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test coverage (no game data needed)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 85
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
